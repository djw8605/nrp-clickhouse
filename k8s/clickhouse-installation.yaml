# ClickHouse cluster + Keeper for the NRP accounting pipeline (Altinity operator).
#
# Reference infrastructure — NOT managed by the kustomize overlays in this repo.
# Apply separately, into the `clickhouse` namespace, before deploying the pipeline:
#
#     kubectl apply -n clickhouse -f k8s/clickhouse-installation.yaml
#
# Topology: 1 shard x 2 replicas (cluster "aime") for high availability, coordinated
# by a 3-node ClickHouse Keeper ensemble (tolerates 1 keeper failure). All tables use
# Replicated* engines so each replica holds a full copy of the data.
# This must stay in sync with CLICKHOUSE_CLUSTER ("aime") in the app ConfigMaps and
# the Replicated* DDL in nrp_accounting_pipeline/schema.py.
---
apiVersion: clickhouse-keeper.altinity.com/v1
kind: ClickHouseKeeperInstallation
metadata:
  name: aime-keeper
  namespace: clickhouse
spec:
  configuration:
    clusters:
      - name: keeper
        layout:
          # 3-node ensemble: quorum survives the loss of any single keeper.
          replicasCount: 3
  defaults:
    templates:
      dataVolumeClaimTemplate: keeper-data
      podTemplate: keeper-pod
  templates:
    podTemplates:
      - name: keeper-pod
        spec:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: topology.kubernetes.io/zone
                        operator: In
                        values:
                          - ucsd-sdsc
            # Spread the 3 keeper pods across distinct nodes.
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      clickhouse-keeper.altinity.com/chk: aime-keeper
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: clickhouse-keeper
              image: altinity/clickhouse-keeper:25.3.8.10042.altinitystable
              resources:
                requests:
                  cpu: 500m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
    volumeClaimTemplates:
      - name: keeper-data
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
          storageClassName: rook-ceph-block
---
apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  name: access-accounting
  namespace: clickhouse
spec:
  configuration:
    clusters:
      - name: aime
        layout:
          # 1 shard, 2 replicas => full data redundancy across two hosts.
          shardsCount: 1
          replicasCount: 2
    zookeeper:
      # Coordination for ReplicatedMergeTree tables, served by the keeper above.
      nodes:
        - host: chk-aime-keeper-keeper-0-0.clickhouse.svc.cluster.local
          port: 2181
        - host: chk-aime-keeper-keeper-0-1.clickhouse.svc.cluster.local
          port: 2181
        - host: chk-aime-keeper-keeper-0-2.clickhouse.svc.cluster.local
          port: 2181
    settings:
      prometheus/endpoint: /metrics
      prometheus/port: 9363
    profiles:
      # Read-only profile for Grafana. readonly=1 blocks writes, DDL and table
      # functions such as url(), file() and remote(). Grafana's ClickHouse plugin
      # sends max_execution_time and parallel_replicas_for_cluster_engines with
      # every query, so those two stay changeable in read-only mode.
      grafana_ro/profile: default
      grafana_ro/readonly: "1"
      grafana_ro/constraints/max_execution_time/max: "600"
      grafana_ro/constraints/max_execution_time/changeable_in_readonly: ""
      grafana_ro/constraints/parallel_replicas_for_cluster_engines/changeable_in_readonly: ""
      # Read-only profile for this repo's read paths: the public MCP server, the
      # OpenAPI bridge and the XDMoD upload. Their slowest query in two weeks took
      # 5.6 s, so 60 s stops a runaway query without cutting off real ones.
      accounting_ro/profile: default
      accounting_ro/readonly: "1"
      accounting_ro/max_execution_time: "60"
    users:
      # `default` has no password and full admin rights, so it gets no extra
      # networks here: the operator only allows it from localhost and the
      # ClickHouse pods themselves. Do not widen it; clients use their own
      # users (`aime` for writers, `accounting_ro` and `grafana_ro` for readers).
      aime/networks/ip:
        - 0.0.0.0/0
      # Do not commit real credentials. Set this out-of-band (e.g. a sealed secret /
      # `kubectl edit chi`) to the SHA-256 hex of the `aime` user password.
      aime/password_sha256_hex: REPLACE_WITH_SHA256_HEX
      # Read-only user for Grafana's "NRP Clickhouse" data source. Grafana should
      # always use this user, never `default` or `aime`.
      grafana_ro/profile: grafana_ro
      grafana_ro/quota: default
      grafana_ro/networks/ip:
        - 10.244.0.0/16
        - fdf0:17b3:c3ec:1f79:10::/108
      grafana_ro/grants/query:
        - GRANT SELECT ON access_accounting.*
        - GRANT SELECT ON reporting.*
      # Do not commit real credentials. Set this out-of-band, like `aime`, to the
      # SHA-256 hex of the password in the monitoring/clickhouse-grafana-ro secret
      # (a SealedSecret in nrp/grafana).
      grafana_ro/password_sha256_hex: REPLACE_WITH_SHA256_HEX
      # Read-only user for the MCP server, OpenAPI bridge and XDMoD upload, which
      # read access_accounting and never write. The MCP server is public and
      # unauthenticated, so it must not hold `aime`, which can write, run DDL and
      # call url(). Its own user, not `grafana_ro`, keeps the password in this
      # repo's secrets and its queries apart in system.query_log.
      accounting_ro/profile: accounting_ro
      accounting_ro/quota: default
      accounting_ro/networks/ip:
        - 10.244.0.0/16
        - fdf0:17b3:c3ec:1f79:10::/108
      accounting_ro/grants/query:
        - GRANT SELECT ON access_accounting.*
      # Do not commit real credentials. Set this out-of-band, like `aime`, to the
      # SHA-256 hex of the password in the access-accounting/clickhouse-readonly-credentials
      # secret (apps/nrp-clickhouse/overlays/dev/sealed-secret-ch-readonly-creds.yaml).
      accounting_ro/password_sha256_hex: REPLACE_WITH_SHA256_HEX
  defaults:
    templates:
      dataVolumeClaimTemplate: ch-data
      podTemplate: ch-pod
  templates:
    podTemplates:
      - name: ch-pod
        spec:
          # Keep the two replicas on different nodes so one node loss never takes
          # out both copies.
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      clickhouse.altinity.com/chi: access-accounting
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: clickhouse
              image: altinity/clickhouse-server:25.8.16.10001.altinitystable
              ports:
                - name: metrics
                  containerPort: 9363
              resources:
                requests:
                  cpu: "4"
                  memory: 16Gi
                limits:
                  cpu: "8"
                  memory: 32Gi
          tolerations:
            - key: nautilus.io/system
              operator: Exists
              effect: NoSchedule
    volumeClaimTemplates:
      - name: ch-data
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 50Gi
          storageClassName: linstor-ha
